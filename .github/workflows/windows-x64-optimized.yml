name: MiKTeX Windows x64 optimized (experimental)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 300
    defaults:
      run:
        shell: pwsh
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '4'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Build tool versions
        run: |
          cmake --version
          git --version
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath

      - name: Install helper tools
        run: |
          choco install -y ninja winflexbison3 strawberryperl --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # MiKTeX's CMake configuration requires GNU gettext and other
      # Unix-style host utilities (msgfmt, msgmerge, xgettext, xsltproc,
      # cat, diff, sed). Install them as tools; this is still an MSVC build.
      - name: Install GNU build utilities (MSYS2)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: >-
            gettext
            diffutils
            sed
            libxslt

      - name: Make GNU utilities available to CMake
        run: |
          $ErrorActionPreference = 'Stop'
          $msysBin = 'C:\msys64\usr\bin'
          if (-not (Test-Path (Join-Path $msysBin 'msgfmt.exe'))) {
            throw "msgfmt.exe not found in $msysBin; check MSYS2 setup"
          }
          # Persist for all subsequent steps, including CMake build rules.
          $msysBin >> $env:GITHUB_PATH
          $env:PATH = "$msysBin;$env:PATH"
          foreach ($tool in @('msgfmt', 'msgmerge', 'xgettext', 'xsltproc', 'cat', 'diff', 'sed')) {
            $cmd = Get-Command $tool -ErrorAction SilentlyContinue
            if (-not $cmd) { throw "Missing required MiKTeX build utility: $tool" }
            Write-Host "$tool => $($cmd.Source)"
          }
          & (Join-Path $msysBin 'msgfmt.exe') --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # MiKTeX uses Qt in parts of its Windows user interface.
      # Adjust Qt version/arch when the checked-out MiKTeX revision requires another version.
      - name: Install Qt 6 (MSVC x64)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qt5compat'
          dir: '${{ github.workspace }}/Qt'          
          cache: true

      - name: Locate Qt
        id: qt
        run: |
          if (-not $env:QT_ROOT_DIR) { throw 'QT_ROOT_DIR is missing after Qt installation' }
          $prefix = $env:QT_ROOT_DIR
          "prefix=$prefix" >> $env:GITHUB_OUTPUT
          Write-Host "Qt prefix: $prefix"

      - name: Locate Windows Message Compiler
        shell: pwsh
        run: |
          $sdkBin = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"
      
          $mc = Get-ChildItem $sdkBin -Filter mc.exe -Recurse -File |
            Where-Object { $_.DirectoryName -match '\\x64$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
      
          if (-not $mc) {
            throw "mc.exe not found in the Windows SDK"
          }
      
          Write-Host "Found: $($mc.FullName)"
      
          $mc.DirectoryName | Out-File `
            -FilePath $env:GITHUB_PATH `
            -Append -Encoding utf8

      - name: Install Boost.Locale and ICU (Windows x64)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $triplet = "x64-windows-static"
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          $vcpkg = Join-Path $vcpkgRoot "vcpkg.exe"
      
          & $vcpkg install "boost-locale:$triplet" "icu:$triplet" --classic
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      
          $root = Join-Path $vcpkgRoot "installed\$triplet"
      
          if (!(Test-Path "$root\include\boost\config.hpp")) {
            throw "Boost headers not found"
          }
      
          if (!(Test-Path "$root\include\unicode\utypes.h")) {
            throw "ICU headers not found"
          }
      
          Write-Host "Boost.Locale libraries:"
          Get-ChildItem "$root\lib" -Filter "*boost_locale*.lib"
      
          Write-Host "ICU libraries:"
          Get-ChildItem "$root\lib" -Filter "icu*.lib"
      
          $root = $root -replace '\\', '/'
          "BOOST_INSTALL_ROOT=$root" >> $env:GITHUB_ENV
          "ICU_INSTALL_ROOT=$root" >> $env:GITHUB_ENV
          
      - name: Configure Release x64 AVX2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) { throw 'VCPKG_INSTALLATION_ROOT is not set' }
          $toolchain = Join-Path $vcpkgRoot 'scripts/buildsystems/vcpkg.cmake'
          $boostRoot = Join-Path $vcpkgRoot 'installed/x64-windows-static'
          if (-not (Test-Path $toolchain)) { throw "vcpkg toolchain not found: $toolchain" }
          Write-Host "Using toolchain: $toolchain"

          # Construct arguments as separate strings to avoid PowerShell expansion/quoting errors.
          $cmakeArgs = @(
            '-S', '.'
            '-B', 'build'
            '-G', 'Visual Studio 17 2022'
            '-A', 'x64'
            '-DCMAKE_CONFIGURATION_TYPES=Release'
            '-DWITH_MIKTEX_API_DOC=OFF'
            '-DWITH_MIKTEX_DOC=OFF'
            '-DWITH_UI_MFC=OFF'
            "-DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/stage"
            "-DCMAKE_PREFIX_PATH=${{ steps.qt.outputs.prefix }}"
            '-DCMAKE_C_FLAGS_RELEASE=/O2 /Oi /arch:AVX2 /DNDEBUG'
            '-DCMAKE_CXX_FLAGS_RELEASE=/O2 /Oi /arch:AVX2 /DNDEBUG'
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain"
            '-DVCPKG_TARGET_TRIPLET=x64-windows-static'
            "-DBOOST_ROOT=$boostRoot"
            "-DBoost_ROOT=$boostRoot"
            "-DBoost_INCLUDE_DIR=$(Join-Path $boostRoot 'include')"
            "-DBOOST_LIBRARYDIR=$(Join-Path $boostRoot 'lib')"
            '-DBoost_USE_STATIC_LIBS=ON'
            '-DBoost_USE_STATIC_RUNTIME=ON'
            "-DICU_ROOT=$env:ICU_INSTALL_ROOT"
            "-DICU_INCLUDE_DIR=$env:ICU_INSTALL_ROOT/include"
          )

          & cmake @cmakeArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Release
        run: |
          cmake --build build --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage executables (not an installer)
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/bin | Out-Null
          $bins = Get-ChildItem build -Recurse -File -Filter *.exe | Where-Object { $_.FullName -match '[\\/]Release[\\/]' }
          if (-not $bins) { throw 'No Release .exe files found; inspect build layout.' }
          foreach ($f in $bins) {
            # Flattening names can collide; retain relative path under build.
            $relative = [IO.Path]::GetRelativePath((Resolve-Path build).Path, $f.FullName)
            $dest = Join-Path 'artifacts/bin' $relative
            New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
            Copy-Item -LiteralPath $f.FullName -Destination $dest
          }
          @'
          Experimental MiKTeX Windows x64 build artifact.
          Not a self-contained distribution or installer.
          Built executables may need DLLs, data, and configuration files.
          '@ | Set-Content artifacts/README.txt

      - name: Upload compiled binaries
        uses: actions/upload-artifact@v4
        with:
          name: miktex-windows-x64-avx2-build
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Upload CMake configuration details (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: miktex-build-diagnostics
          path: |
            build/CMakeCache.txt
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/CMakeFiles/CMakeError.log
            build/CMakeFiles/CMakeOutput.log
          if-no-files-found: ignore
